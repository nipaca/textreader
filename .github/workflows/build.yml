name: Build Text Reader

# Runs only when you start it yourself: Actions tab -> "Build Text Reader" -> "Run workflow".
on:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK as a GitHub Release

concurrency:
  group: build-text-reader
  cancel-in-progress: false

env:
  SHERPA_VERSION: "1.13.7"
  KOKORO_MODEL: "kokoro-multi-lang-v1_0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Get the code
        uses: actions/checkout@v6

      - name: Read version.txt
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < version.txt)"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version.txt must look like 1.0.0 (found '$VERSION')"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Text Reader $VERSION"

      # Safety: never release an APK signed with a temporary key (it couldn't install as an update).
      - name: Check signing secrets
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$SIGNING_KEYSTORE_BASE64" ] && missing="$missing SIGNING_KEYSTORE_BASE64"
          [ -z "$SIGNING_KEYSTORE_PASSWORD" ] && missing="$missing SIGNING_KEYSTORE_PASSWORD"
          [ -z "$SIGNING_KEY_ALIAS" ] && missing="$missing SIGNING_KEY_ALIAS"
          [ -z "$SIGNING_KEY_PASSWORD" ] && missing="$missing SIGNING_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Signing key not set up. Missing secret(s):$missing. See SIGNING.md."
            exit 1
          fi
          echo "All signing secrets are present."

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The voice model (~350 MB) is downloaded once and then reused from the cache.
      - name: Restore cached voice model and libraries
        id: deps-cache
        uses: actions/cache@v5
        with:
          path: .downloads
          key: deps-sherpa-${{ env.SHERPA_VERSION }}-${{ env.KOKORO_MODEL }}-tess-fast-${{ hashFiles('scripts/fetch-deps.sh') }}

      - name: Download voice model and libraries (first build only)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: bash scripts/fetch-deps.sh download

      - name: Add voice model and libraries to the app
        run: bash scripts/fetch-deps.sh install

      # Caches Gradle and compiled code so later builds are faster.
      - name: Set up Gradle (with build cache)
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.11.1"

      - name: Decode signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode --ignore-garbage > "$RUNNER_TEMP/release.keystore"
          if [ ! -s "$RUNNER_TEMP/release.keystore" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 could not be decoded. Copy it again (see SIGNING.md)."
            exit 1
          fi
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build the APK
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --build-cache --stacktrace

      # Safety: the decoded key file never stays on the build machine, even if the build failed.
      - name: Remove the decoded key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Read the signing fingerprint
        id: cert
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          SHA="$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk \
            | grep -m1 'SHA-256 digest' | sed 's/.*: //')"
          echo "Signing certificate SHA-256: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          CERT_SHA: ${{ steps.cert.outputs.sha }}
        run: |
          TAG="v$VERSION"
          APK="TextReader-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          ls -lh "$APK"

          # Same version as before? Replace that release.
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true

          printf 'Text Reader %s\n\nInstall: download %s on your phone and open it.\n\nSigning certificate SHA-256 (the same on every release):\n`%s`\n' \
            "$VERSION" "$APK" "$CERT_SHA" > notes.txt

          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Text Reader $VERSION" \
            --notes-file notes.txt
